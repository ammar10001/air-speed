<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار سرعة الطائرة ✈️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0b0e14; 
            color: #00ffcc; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            margin: 0;
            overflow: hidden;
        }
        .dashboard {
            text-align: center;
            border: 4px solid #00ffcc;
            padding: 40px;
            border-radius: 50%;
            width: 300px;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            background: radial-gradient(circle, #1a202c 0%, #0b0e14 100%);
        }
        .speed-value {
            font-size: 5rem;
            font-weight: bold;
            line-height: 1;
        }
        .unit {
            font-size: 1.5rem;
            color: #888;
        }
        .info-panel {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            font-size: 1.2rem;
        }
        .info-box {
            background: rgba(0, 255, 204, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #00ffcc;
        }
        .btn-toggle {
            margin-top: 20px;
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px 20px;
            cursor: pointer;
        }
        .btn-toggle:hover {
            background: #00ffcc;
            color: #0b0e14;
        }
        .status {
            font-size: 0.9rem;
            color: #ff4d4d;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1 class="mb-4">✈️ رادار السرعة الجوية</h1>
    <div id="status" class="status">جاري البحث عن إشارات GPS...</div>

    <div class="dashboard">
        <div class="unit" id="unit-label">كم/ساعة</div>
        <div class="speed-value" id="speed">0</div>
        <div class="unit">السرعة الحالية</div>
    </div>

    <div class="info-panel">
        <div class="info-box">
            الارتفاع: <span id="altitude">--</span> م
        </div>
        <div class="info-box">
            الدقة: <span id="accuracy">--</span> م
        </div>
    </div>

    <button class="btn-toggle" onclick="toggleUnit()">تغيير وحدة القياس</button>

    <script>
        let currentUnit = 'kmh'; // kmh, mph, knots

        function toggleUnit() {
            if (currentUnit === 'kmh') currentUnit = 'mph';
            else if (currentUnit === 'mph') currentUnit = 'knots';
            else currentUnit = 'kmh';
            
            const labels = { 'kmh': 'كم/ساعة', 'mph': 'ميل/ساعة', 'knots': 'عقدة (Knot)' };
            document.getElementById('unit-label').innerText = labels[currentUnit];
            updateDisplay(lastPosition);
        }

        let lastPosition = null;

        function updateDisplay(position) {
            if (!position) return;

            let speed = position.coords.speed; // Speed in m/s
            
            if (speed === null || speed < 0) {
                document.getElementById('speed').innerText = "0";
            } else {
                let convertedSpeed = speed * 3.6; // Default km/h

                if (currentUnit === 'mph') {
                    convertedSpeed = speed * 2.23694;
                } else if (currentUnit === 'knots') {
                    convertedSpeed = speed * 1.94384;
                }

                document.getElementById('speed').innerText = Math.round(convertedSpeed);
            }

            document.getElementById('altitude').innerText = position.coords.altitude ? Math.round(position.coords.altitude) : "--";
            document.getElementById('accuracy').innerText = Math.round(position.coords.accuracy);
            document.getElementById('status').innerText = "✅ متصل بنظام GPS";
            document.getElementById('status').style.color = "#00ffcc";
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    lastPosition = position;
                    updateDisplay(position);
                },
                (error) => {
                    document.getElementById('status').innerText = "❌ خطأ: يرجى تفعيل GPS ومنح صلاحية الوصول للموقع";
                    console.error("Error getting location: ", error);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                }
            );
        } else {
            document.getElementById('status').innerText = "❌ متصفحك لا يدعم تحديد الموقع";
        }
    </script>
</body>
</html>
